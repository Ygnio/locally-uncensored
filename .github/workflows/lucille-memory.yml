name: Lucille identity and memory

on:
  push:
    branches: [feature/lucille-memory-hybrid-phase1, feature/lucille-unified-identity-code, feature/lucille-phase16-validation, feature/lucille-phase2-intelligent-memory, feature/lucille-phase21-semantic-learning, feature/lucille-phase21b-quality, feature/lucille-phase21c-real-inference, feature/lucille-phase21d-real-quality, feature/lucille-phase22-autonomous-memory, feature/lucille-phase22b-answer-fidelity, feature/lucille-phase22c-evidence-authority, feature/lucille-phase22d-learning-integrity, feature/lucille-phase22e-source-authority, feature/lucille-phase22f-canonical-reliability]
  pull_request:
    branches: [master, feature/lucille-memory-hybrid-phase1, feature/lucille-unified-identity-code, feature/lucille-phase16-validation, feature/lucille-phase2-intelligent-memory, feature/lucille-phase21-semantic-learning, feature/lucille-phase21b-quality, feature/lucille-phase21c-real-inference, feature/lucille-phase21d-real-quality, feature/lucille-phase22-autonomous-memory, feature/lucille-phase22b-answer-fidelity, feature/lucille-phase22c-evidence-authority, feature/lucille-phase22d-learning-integrity, feature/lucille-phase22e-source-authority]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.lucille-build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies without launching applications
        run: npm ci --ignore-scripts
      - name: Evaluator contract and literal source attribution rubric
        run: |
          node --test qa/phase22e-evaluator-contract.test.mjs
          python qa/phase22e-origin-rubric.py
          python qa/phase22f-evaluation.test.py
      - name: Real Rust SQLite and FTS5 tests
        run: cargo test --locked --manifest-path crates/lucille-memory/Cargo.toml
      - name: Build real synthetic integration bridge
        run: cargo build --locked --manifest-path crates/lucille-memory/Cargo.toml --example synthetic_bridge
      - name: Shared adapter, real SQLite and native memory regression tests
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          export LUCILLE_QA_BRIDGE="$CARGO_TARGET_DIR/debug/examples/synthetic_bridge$suffix"
          npx vitest run --maxWorkers=1 \
            src/api/__tests__/comfy-edit-card-memory.test.ts \
            src/hooks/__tests__/memory-deleted-stays-deleted.test.ts \
            src/hooks/__tests__/memory-extraktion-bucht-lokale-spur.test.ts \
            src/hooks/__tests__/memory-learns-about-the-user-on-a-phone.test.ts \
            src/hooks/__tests__/memory-reaches-the-phone-engine.test.ts \
            src/hooks/__tests__/memory-silent-call-gate.test.ts \
            src/hooks/__tests__/useCreate-mac-edit-memory.test.ts \
            src/stores/__tests__/lucille-binding-persistence.test.ts \
            src/stores/__tests__/memory-collections.test.ts \
            src/stores/__tests__/memory-context-cap.test.ts \
            src/stores/__tests__/memory-forget-race.test.ts \
            src/stores/__tests__/memory-import-history.test.ts \
            src/stores/__tests__/memory-markdown-roundtrip.test.ts \
            src/stores/__tests__/memory-provenance.test.ts \
            src/stores/__tests__/memory-remove-undo.test.ts \
            src/stores/__tests__/memory-scope.test.ts \
            src/stores/__tests__/memory-sensitive.test.ts \
            src/stores/__tests__/memory-sources.test.ts \
            src/stores/__tests__/memory-tool-result-filter.test.ts \
            src/stores/__tests__/memory-vectors-idb-refused.test.ts \
            src/stores/__tests__/memoryStore-migrate.test.ts \
            src/stores/__tests__/remote-memory-hydration.test.ts \
            src/stores/__tests__/remote-memory-revocation.test.ts \
            src/lib/__tests__/app-identity.test.ts \
            src/lib/__tests__/builtin-model-identity.test.ts \
            src/lib/__tests__/cloud-teaser-click-identity.test.ts \
            src/lib/__tests__/comfy-edit-memory.test.ts \
            src/lib/__tests__/displaced-engine-frees-its-memory.test.ts \
            src/lib/__tests__/lucille-answer.test.ts \
            src/lib/__tests__/lucille-atomic.test.ts \
            src/lib/__tests__/lucille-authority.test.ts \
            src/lib/__tests__/lucille-context.test.ts \
            src/lib/__tests__/lucille-fidelity.test.ts \
            src/lib/__tests__/lucille-phase22e.test.ts \
            src/lib/__tests__/lucille-phase22f-operations.test.ts \
            src/lib/__tests__/lucille-phase22f-project-history.test.ts \
            src/lib/__tests__/lucille-full-bootstrap.test.ts \
            src/lib/__tests__/lucille-index-worker.test.ts \
            src/lib/__tests__/lucille-learning.test.ts \
            src/lib/__tests__/lucille-llm.test.ts \
            src/lib/__tests__/lucille-prepared-source.test.ts \
            src/lib/__tests__/lucille-real-sqlite.test.ts \
            src/lib/__tests__/lucille-real-validation.test.ts \
            src/lib/__tests__/lucille-semantic.test.ts \
            src/lib/__tests__/lucille-unified.test.ts \
            src/lib/__tests__/mac-edit-memory.test.ts \
            src/lib/__tests__/mac-memory-fit.test.tsx \
            src/lib/__tests__/memory-e2e.test.ts \
            src/lib/__tests__/memory-extraction-phone-rules.test.ts \
            src/lib/__tests__/memory-extraction.test.ts \
            src/lib/__tests__/memory-forget.test.ts \
            src/lib/__tests__/memory-learning-yield.test.ts \
            src/lib/__tests__/memory-legacy-uebernehmen.test.ts \
            src/lib/__tests__/memory-persistence.test.ts \
            src/lib/__tests__/memory-retrieval.test.ts \
            src/lib/__tests__/memory-sync-coordinator.test.ts \
            src/lib/__tests__/memory-sync-plan.test.ts \
            src/lib/__tests__/onboarding-shared-memory.test.ts \
            src/lib/__tests__/shared-memory-wording.test.ts \
            src/api/cloud/__tests__/memory-sync.test.ts \
            src/components/chat/__tests__/memory-panel-delete.test.tsx \
            src/components/chat/__tests__/memory-sources-chip-is-gone.test.ts \
            src/mobile/boot/__tests__/memory-default.test.ts \
            src/mobile/data/__tests__/device-memory.test.ts \
            src/lib/computer/__tests__/memory-policy.test.ts \
            src/components/create/experimental/__tests__/mac-edit-reference-slots-follow-memory.test.tsx
      - name: Atomic source grammar parity (no model or Windows API call)
        run: python scripts/test-lucille-atomic-schema.py
      - name: Type check
        run: npm run typecheck
      - name: Build frontend without opening GUI
        run: npm run build
      - name: Type check dedicated QA frontend
        run: npx tsc -p tsconfig.lucille-qa.json --noEmit
      - name: Build dedicated QA frontend
        run: npx vite build --config vite.lucille-qa.config.ts
      - name: Compile real isolated QA host (Windows)
        if: runner.os == 'Windows'
        run: cargo build --locked --manifest-path crates/lucille-qa/Cargo.toml
